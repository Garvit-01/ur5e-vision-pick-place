/**:
    ros__parameters:
        image_transport: raw
        family: 36h11
        size: 0.05              # tag edge size in meters - matches the cube used throughout the UR5e pipeline
        max_hamming: 0
        qos_profile: sensor_data

        detector:
            threads: 1
            decimate: 2.0
            blur: 0.0
            refine: True
            sharpening: 0.25
            debug: False

        pose_estimation_method: "pnp"

        tag:
            ids: [0]
            frames: [target_cube]   # published TF child frame name
            sizes: [0.05]
